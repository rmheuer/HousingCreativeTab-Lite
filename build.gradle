plugins {
    id("dev.kikugie.loom-back-compat")
}

version = "${property("mod.version")}+${stonecutter.current.version}"
base.archivesName = property("mod.id") as String

JavaVersion requiredJava
int javaVersion
if (stonecutter.current.parsed >= "26.1") {
    requiredJava = JavaVersion.VERSION_25
    javaVersion = 25
} else {
    requiredJava = JavaVersion.VERSION_21
    javaVersion = 21
}

dependencies {
    minecraft "com.mojang:minecraft:${stonecutter.current.version}"
    modImplementation "net.fabricmc:fabric-loader:${property("deps.fabric_loader")}"
    loomx.applyMojangMappings()

    modImplementation "net.fabricmc.fabric-api:fabric-api:${property("deps.fabric_api")}"
}

processResources {
    inputs.property "version", project.property("mod.version")
    inputs.property "minecraft_version", stonecutter.current.version
    inputs.property "loader_version", project.property("deps.fabric_loader")
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.property("mod.version"),
                "minecraft_version": stonecutter.current.version,
                "loader_version": project.property("deps.fabric_loader")
    }
}

tasks.register("buildAndCollect", Copy) {
    group = "build"
    description = "Builds mod jars and copies results to `build/libs/${project.property("mod.version")}/`"

    inputs.property("version", project.property("mod.version"))
    // loomx.mod(Sources)Jar returns the jar task for the applied loom variant
    from(loomx.modJar.flatMap { it.archiveFile }, loomx.modSourcesJar.flatMap { it.archiveFile })
    into(rootProject.layout.buildDirectory.file("libs/${project.property("mod.version")}"))
}


tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (javaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(javaVersion)
    }
}

java {
    if (JavaVersion.current() < requiredJava) {
        toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}